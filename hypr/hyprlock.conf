
background {
    monitor =
    path = ../screenshots/wallpaper.jpg
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

animations {
    enabled = true

    bezier = linear, 1, 1, 0, 0

    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
}

input-field {
    monitor =
    size = 170, 50
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.2 
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}


label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 100
    font_family = SF Pro Display Bold
    position = 0, 240
    halign = center
    valign = center
}


label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 16
    font_family = SF Pro Display Bold
    position = 0, 160
    halign = center
    valign = center
}


image {
    monitor =
    path = ../screenshots/face.png
    border_color = 0xffdddddd
    border_size = 0
    size = 80
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hi, $USER
    color = rgba(216, 222, 233, 0.70)
    font_size = 16
    font_family = SF Pro Display Bold
    position = 0, -80
    halign = center
    valign = center
}



label {
    monitor =
    text = In your Eyes  The Weeknd
    color = rgba(255, 255, 255, 0.7)
